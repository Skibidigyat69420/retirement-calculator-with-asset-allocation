name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/stw-backend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/stw-backend:${{ github.sha }}

      - name: Build and push API Utils
        uses: docker/build-push-action@v5
        with:
          context: .
          file: functions/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/stw-api-utils:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/stw-api-utils:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/stw-frontend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/stw-frontend:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Copy docker-compose and nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/nginx.conf"
          target: "~/stw-app"

      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: REGISTRY, IMAGE_NAME
          script: |
            # Login to GHCR (requires a PAT in secrets.CR_PAT if pulling private packages, though GITHUB_TOKEN works for pushing)
            # If the repository is public, ghcr.io pulls do not require authentication.
            # Assuming private repo for a calculator app:
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            cd ~/stw-app
            export DOCKER_REGISTRY=${REGISTRY}/${IMAGE_NAME}
            
            # Export secrets required by docker-compose
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            export SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}
            
            # Pull latest images
            docker compose -f docker-compose.prod.yml pull
            
            # Restart services
            docker compose -f docker-compose.prod.yml up -d
