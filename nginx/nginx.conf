# Edge proxy for the docker-compose stack: single public entrypoint.
#   /api/v1/**  → backend (Fastify practitioner API)
#   /api/**     → api-utils (utility endpoints + Angel One proxy)
#   /**         → frontend (SPA)
events {}

http {
    upstream frontend {
        server frontend:80;
    }

    upstream backend {
        server backend:4000;
    }

    upstream api_utils {
        server api-utils:8080;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        # Practitioner backend
        location /api/v1/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public utility endpoints + Angel One reverse proxy
        location /api/ {
            proxy_pass http://api_utils;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
